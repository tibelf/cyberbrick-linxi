# 每次推送和 PR 跑 linx-client 的全部测试并统计覆盖率；合进 main 后更新 README 上的覆盖率徽章。
# 徽章数据写在单独的 badges 分支（shields.io 读取 coverage.json），不需要外部服务和密钥。
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # 推 badges 分支

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: linx-client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: linx-client/requirements*.txt

      - name: 安装依赖
        # 标记跟踪、摄像头测试要 OpenCV；CI 没有图形界面，用 headless 版
        run: pip install -r requirements-dev.txt opencv-python-headless

      - name: 跑测试并统计覆盖率
        run: python -m pytest -q --cov=linx_client --cov-report=term --cov-report=json

      - name: 更新覆盖率徽章
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/badges"
          python - "$RUNNER_TEMP/badges/coverage.json" <<'EOF'
          import json, sys
          pct = round(json.load(open("coverage.json"))["totals"]["percent_covered"])  # 显示的数字和颜色按同一个值
          color = next(c for limit, c in [(90, "brightgreen"), (80, "green"), (70, "yellowgreen"),
                                          (60, "yellow"), (50, "orange"), (0, "red")] if pct >= limit)
          badge = {"schemaVersion": 1, "label": "coverage", "message": f"{pct:.0f}%", "color": color}
          json.dump(badge, open(sys.argv[1], "w"))
          print(badge)
          EOF
          cd "$RUNNER_TEMP/badges"
          git init -q -b badges
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add coverage.json
          git commit -q -m "coverage badge for ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges
