# 在现有已启用 Basic Auth 的 HTTPS server 内 include 此文件。
# 只提供指定 APK，不公开目录，不改变 /control 代理或控制程序。
location = /android/cyberbrick-v0.1.0.apk {
    alias /srv/cyberbrick-downloads/cyberbrick-v0.1.0.apk;
    default_type application/vnd.android.package-archive;
    add_header Content-Disposition 'attachment; filename="cyberbrick-v0.1.0.apk"';
    add_header Cache-Control "no-store";
}

location = /android/cyberbrick-v0.2.0.apk {
    alias /srv/cyberbrick-downloads/cyberbrick-v0.2.0.apk;
    default_type application/vnd.android.package-archive;
    add_header Content-Disposition 'attachment; filename="cyberbrick-v0.2.0.apk"';
    add_header Cache-Control "no-store";
}
