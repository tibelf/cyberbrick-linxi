<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>CyberBrick 语音交互</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><style>body{margin:0}a{color:#E8C547}a:hover{color:#F8DA70}</style></helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#12151A;color:#F2F3F5;font-family:Roboto,'Noto Sans SC','PingFang SC',sans-serif;display:flex;flex-direction:column;padding-top:20px;overflow:hidden">
  <header style="height:56px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 20px">
    <h1 style="font-size:22px;letter-spacing:-.6px;margin:0;font-weight:700">语音控车</h1>
    <a href="Main.dc.html" aria-label="返回遥控" style="width:44px;height:44px;border:1px solid #353B45;border-radius:14px;color:#D6DBE3;display:flex;align-items:center;justify-content:center;text-decoration:none"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="4"></rect><path d="M7 12h5M9.5 9.5v5M16 11h1M17 14h1"></path></svg></a>
  </header>
  <main style="padding:12px 20px 0;flex:1;min-height:0;display:flex;flex-direction:column;gap:18px">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;height:32px;flex-shrink:0;font-size:12px"><span style="color:#DCE2EB">灵矽已连接</span><span style="color:#AEB7C6">小车在线</span></div>
    <div style="flex:1;min-height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px">
      <div style="width:104px;height:104px;border-radius:36px;border:1px solid {{micBorder}};background:{{micBackground}};color:{{micColor}};display:flex;align-items:center;justify-content:center">
        <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M6 10v2a6 6 0 0 0 12 0v-2M12 18v3M9 21h6"></path></svg>
      </div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:9px">
        <sc-if value="{{recording}}" hint-placeholder-val="{{true}}"><h2 style="font-size:28px;letter-spacing:-.8px;margin:0;font-weight:650">正在听你说</h2></sc-if>
        <sc-if value="{{waiting}}" hint-placeholder-val="{{false}}"><h2 style="font-size:28px;letter-spacing:-.8px;margin:0;font-weight:650">正在理解指令</h2></sc-if>
        <sc-if value="{{replied}}" hint-placeholder-val="{{false}}"><h2 style="font-size:28px;letter-spacing:-.8px;margin:0;font-weight:650">收到你的指令</h2></sc-if>
        <sc-if value="{{idle}}" hint-placeholder-val="{{false}}"><h2 style="font-size:28px;letter-spacing:-.8px;margin:0;font-weight:650">准备好再说一句</h2></sc-if>
        <span style="font-size:13px;color:#B6BFCC;line-height:20px">{{hint}}</span>
      </div>
    </div>
    <section style="padding:18px;border:1px solid #353C47;border-radius:20px;background:#1D222A;display:flex;flex-direction:column;gap:12px">
      <span style="font-size:11px;font-weight:600;letter-spacing:1px;color:{{accent}}">可以这样说</span>
      <p style="font-size:21px;line-height:1.55;font-weight:550;letter-spacing:-.4px;margin:0">前进一秒，<br>然后停下。</p>
      <div style="height:1px;background:#373E49"></div>
      <sc-if value="{{notReplied}}" hint-placeholder-val="{{true}}"><p style="margin:0;font-size:12px;line-height:20px;color:#AFB9C8">识别结果与小车回复会显示在这里。</p></sc-if>
      <sc-if value="{{replied}}" hint-placeholder-val="{{false}}"><div style="display:flex;flex-direction:column;gap:7px"><span style="font-size:11px;color:#ADB7C6">回复示例</span><p style="margin:0;font-size:14px;line-height:22px;color:#EDF0F5">收到，前进一秒后停车。</p></div></sc-if>
    </section>
    <button type="button" onClick="{{talk}}" disabled="{{waiting}}" style="height:60px;flex-shrink:0;border:1px solid {{buttonBorder}};border-radius:17px;background:{{buttonBackground}};color:{{buttonColor}};font-family:inherit;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px">
      <sc-if value="{{recording}}" hint-placeholder-val="{{true}}"><svg width="17" height="17" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><rect x="3" y="3" width="14" height="14" rx="3"></rect></svg></sc-if>
      {{buttonText}}
    </button>
    <p style="font-size:11px;line-height:18px;color:#ADB7C6;text-align:center;margin:0">点一下开始，再点一下结束，不用长按。</p>
  </main>
  <footer style="flex-shrink:0;padding:12px 20px 12px;display:flex;flex-direction:column;gap:8px">
    <button type="button" onClick="{{stop}}" style="height:52px;border:1px solid #82534F;border-radius:15px;background:#42282B;color:#FFD6D0;font-family:inherit;font-size:15px;font-weight:650;display:flex;align-items:center;justify-content:center;gap:9px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M8 3h8l5 5v8l-5 5H8l-5-5V8z"></path><path d="M9 9h6v6H9z"></path></svg>立即停止</button>
    <nav aria-label="主导航" style="height:64px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;border-top:1px solid #2A303A;padding-top:6px;box-sizing:border-box">
      <a href="Main.dc.html" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#AEB7C6;text-decoration:none;font-size:11px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="4"></rect><path d="M7 12h5M9.5 9.5v5M16 11h1M17 14h1"></path></svg>遥控</a>
      <a href="Voice.dc.html" aria-current="page" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:{{accent}};text-decoration:none;font-size:11px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M6 10v2a6 6 0 0 0 12 0v-2M12 18v3M9 21h6"></path></svg>语音</a>
      <a href="Connect.dc.html" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#AEB7C6;text-decoration:none;font-size:11px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="m9 15 6-6M8 17l-1 1a4 4 0 0 1-6-6l4-4a4 4 0 0 1 6 0M16 7l1-1a4 4 0 0 1 6 6l-4 4a4 4 0 0 1-6 0" transform="translate(0 -1)"></path></svg>连接</a>
    </nav>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#E8C547","options":["#E8C547","#94BDF7","#C7D890"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  state = {phase: 'recording'};
  componentWillUnmount() { clearTimeout(this.replyTimer); }
  renderVals() {
    const phase = this.state.phase;
    const recording = phase === 'recording';
    const waiting = phase === 'waiting';
    const accent = this.props.accent ?? '#E8C547';
    return {
      accent, recording, waiting, replied: phase === 'reply', idle: phase === 'idle', notReplied: phase !== 'reply',
      hint: recording ? '说完后，点击下方结束说话' : waiting ? '收音已结束，请稍候' : phase === 'reply' ? '可以点击按钮再说一句' : '已停止 · 发射已锁定',
      micBorder: recording ? '#82534F' : '#4D4940', micBackground: recording ? '#42282B' : '#2C2B25', micColor: recording ? '#FFD6D0' : accent,
      buttonBorder: recording ? '#A96760' : '#7D723F', buttonBackground: recording ? '#743D3C' : waiting ? '#2C323B' : accent,
      buttonColor: recording ? '#FFF1ED' : waiting ? '#CFD6E0' : '#171A20',
      buttonText: recording ? '结束说话' : waiting ? '正在识别…' : '点击开始说话',
      talk: () => {
        clearTimeout(this.replyTimer);
        if (recording) {
          this.setState({phase: 'waiting'});
          this.replyTimer = setTimeout(() => this.setState({phase: 'reply'}), 1200);
        } else if (!waiting) this.setState({phase: 'recording'});
      },
      stop: () => { clearTimeout(this.replyTimer); this.setState({phase: 'idle'}); }
    };
  }
}
</script>
</body>
</html>
