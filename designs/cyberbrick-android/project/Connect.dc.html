<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>CyberBrick 连接设置</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><style>body{margin:0}a{color:#E8C547}a:hover{color:#F8DA70}</style></helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#12151A;color:#F2F3F5;font-family:Roboto,'Noto Sans SC','PingFang SC',sans-serif;display:flex;flex-direction:column;padding-top:20px;overflow:hidden">
  <header style="height:56px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 20px;gap:12px"><h1 style="font-size:22px;letter-spacing:-.6px;margin:0;font-weight:700">连接设置</h1><span style="font-size:11px;color:#AEB7C6;letter-spacing:.6px">CyberBrick</span></header>
  <main style="flex:1;min-height:0;padding:18px 20px 0;display:flex;flex-direction:column;gap:22px">
    <div style="display:flex;flex-direction:column;gap:9px"><h2 style="margin:0;font-size:24px;letter-spacing:-.6px;font-weight:650">连接你的小车</h2><p style="margin:0;font-size:12px;line-height:21px;color:#B5BECC">开启小车电源与已配置的热点。<br>使用现有网页的控制密码即可。</p></div>
    <section aria-label="连接信息" style="display:flex;flex-direction:column;gap:16px">
      <div style="display:flex;flex-direction:column;gap:8px"><label for="server" style="font-size:12px;font-weight:550;color:#D4DAE4">服务器地址</label><input id="server" type="url" value="{{server}}" onChange="{{serverChange}}" spellcheck="false" autocomplete="off" style="box-sizing:border-box;height:50px;width:100%;padding:0 14px;border:1px solid #46505E;border-radius:13px;background:#1D232C;color:#EDF0F5;font-family:inherit;font-size:14px"></div>
      <div style="display:flex;flex-direction:column;gap:8px"><label for="username" style="font-size:12px;font-weight:550;color:#D4DAE4">用户名</label><input id="username" type="text" value="{{username}}" onChange="{{usernameChange}}" autocomplete="off" style="box-sizing:border-box;height:50px;width:100%;padding:0 14px;border:1px solid #46505E;border-radius:13px;background:#1D232C;color:#EDF0F5;font-family:inherit;font-size:14px"></div>
      <div style="display:flex;flex-direction:column;gap:8px"><label for="password" style="font-size:12px;font-weight:550;color:#D4DAE4">控制密码</label><input id="password" type="password" value="{{password}}" onChange="{{passwordChange}}" placeholder="输入控制密码" autocomplete="off" style="box-sizing:border-box;height:50px;width:100%;padding:0 14px;border:1px solid #46505E;border-radius:13px;background:#1D232C;color:#EDF0F5;font-family:inherit;font-size:14px"></div>
    </section>
    <sc-if value="{{notConnected}}" hint-placeholder-val="{{true}}"><button type="button" onClick="{{connect}}" disabled="{{connecting}}" style="width:100%;height:56px;border:1px solid #D5B448;border-radius:16px;background:{{accent}};color:#171A20;font-family:inherit;font-size:16px;font-weight:750">{{connectLabel}}</button></sc-if>
    <sc-if value="{{connected}}" hint-placeholder-val="{{false}}"><a href="Main.dc.html" style="height:56px;display:flex;align-items:center;justify-content:center;border:1px solid #D5B448;border-radius:16px;background:{{accent}};color:#171A20;font-size:16px;font-weight:750;text-decoration:none">进入遥控</a></sc-if>
    <section aria-label="连接状态" style="display:flex;flex-direction:column;gap:12px;padding:16px;border:1px solid #343C48;background:#1B2028;border-radius:18px">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:12px"><span style="color:#DDE2EB">云端服务</span><span style="color:{{stateColor}}">{{cloudState}}</span></div>
      <div style="height:1px;background:#343C48"></div>
      <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:12px"><span style="color:#DDE2EB">真实小车</span><span style="color:{{stateColor}}">{{carState}}</span></div>
      <div style="height:1px;background:#343C48"></div>
      <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:12px"><span style="color:#DDE2EB">灵矽语音</span><span style="color:{{stateColor}}">{{linxState}}</span></div>
    </section>
    <a href="Offline.dc.html" style="min-height:44px;display:flex;align-items:center;justify-content:center;gap:7px;font-size:12px;color:#B9C3D3;text-decoration:none">小车离线时怎么处理<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg></a>
  </main>
  <footer style="flex-shrink:0;padding:8px 20px 12px">
    <nav aria-label="主导航" style="height:64px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;border-top:1px solid #2A303A;padding-top:6px;box-sizing:border-box">
      <a href="Main.dc.html" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#AEB7C6;text-decoration:none;font-size:11px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="4"></rect><path d="M7 12h5M9.5 9.5v5M16 11h1M17 14h1"></path></svg>遥控</a>
      <a href="Voice.dc.html" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#AEB7C6;text-decoration:none;font-size:11px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M6 10v2a6 6 0 0 0 12 0v-2M12 18v3M9 21h6"></path></svg>语音</a>
      <a href="Connect.dc.html" aria-current="page" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:{{accent}};text-decoration:none;font-size:11px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="m9 15 6-6M8 17l-1 1a4 4 0 0 1-6-6l4-4a4 4 0 0 1 6 0M16 7l1-1a4 4 0 0 1 6 6l-4 4a4 4 0 0 1-6 0" transform="translate(0 -1)"></path></svg>连接</a>
    </nav>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#E8C547","options":["#E8C547","#94BDF7","#C7D890"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  state = {phase: 'idle', server: 'https://110.40.227.30', username: 'car', password: ''};
  componentWillUnmount() { clearTimeout(this.connectionTimer); }
  renderVals() {
    const connected = this.state.phase === 'connected';
    const connecting = this.state.phase === 'connecting';
    const accent = this.props.accent ?? '#E8C547';
    return {
      accent, connected, connecting, notConnected: !connected,
      server: this.state.server, username: this.state.username, password: this.state.password,
      serverChange: event => this.setState({server: event.target.value}),
      usernameChange: event => this.setState({username: event.target.value}),
      passwordChange: event => this.setState({password: event.target.value}),
      connectLabel: connecting ? '正在连接…' : '连接小车',
      cloudState: connected ? '已连接' : connecting ? '连接中' : '未连接',
      carState: connected ? '在线' : '等待连接', linxState: connected ? '已就绪' : '等待连接',
      stateColor: connected ? accent : '#ADB7C6',
      connect: () => {
        if (connecting) return;
        this.setState({phase: 'connecting'});
        this.connectionTimer = setTimeout(() => this.setState({phase: 'connected'}), 900);
      }
    };
  }
}
</script>
</body>
</html>
