<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>CyberBrick 遥控</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><style>body{margin:0}a{color:#E8C547}a:hover{color:#F8DA70}</style></helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#12151A;color:#F2F3F5;font-family:Roboto,'Noto Sans SC','PingFang SC',sans-serif;display:flex;flex-direction:column;padding-top:20px;overflow:hidden">
  <header style="height:56px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 20px;gap:12px">
    <div style="display:flex;align-items:center;gap:10px">
      <div style="width:36px;height:36px;border-radius:10px;background:{{accent}};display:flex;align-items:center;justify-content:center;color:#171A20">
        <svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="7" width="16" height="11" rx="3"></rect><path d="M8 7V4h8v3M12 4V1M7 11v3M17 11v3M8 18v3M16 18v3"></path></svg>
      </div>
      <div style="display:flex;flex-direction:column;gap:3px"><strong style="font-size:20px;font-weight:750;letter-spacing:-.4px">CyberBrick</strong><span style="font-size:11px;letter-spacing:1.6px;color:#AAB2BF">云端遥控</span></div>
    </div>
    <a href="Connect.dc.html" aria-label="连接设置" style="width:44px;height:44px;border:1px solid #353B45;border-radius:14px;color:#D6DBE3;display:flex;align-items:center;justify-content:center;text-decoration:none">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 17h16"></path><circle cx="9" cy="7" r="3" fill="#12151A"></circle><circle cx="15" cy="17" r="3" fill="#12151A"></circle></svg>
    </a>
  </header>
  <main style="flex:1;min-height:0;padding:12px 20px 0;display:flex;flex-direction:column;gap:12px">
    <div style="height:32px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:12px">
      <span style="display:flex;align-items:center;gap:7px;color:#F0F2F5"><svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="{{accent}}" stroke-width="1.8" aria-hidden="true"><circle cx="10" cy="10" r="7"></circle><path d="m6.5 10 2.3 2.3 4.8-4.8"></path></svg>小车在线</span>
      <span style="color:#B5BDC9">灵矽已就绪</span>
    </div>
    <a href="Voice.dc.html" style="height:64px;box-sizing:border-box;flex-shrink:0;background:#242932;border:1px solid #353C48;border-radius:18px;padding:10px 12px;display:flex;align-items:center;gap:12px;text-decoration:none;color:#F2F3F5">
      <span style="width:40px;height:40px;flex-shrink:0;border-radius:13px;background:{{accent}};color:#171A20;display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M6 10v2a6 6 0 0 0 12 0v-2M12 18v3M9 21h6"></path></svg></span>
      <span style="display:flex;flex:1;flex-direction:column;gap:5px"><strong style="font-size:15px;font-weight:650">说句话，让小车动起来</strong><span style="font-size:11px;color:#B6BFCC">点击开始，再次点击结束</span></span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#B6BFCC" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg>
    </a>
    <section style="flex:1;min-height:222px;display:flex;flex-direction:column;justify-content:space-between;gap:8px;padding:5px 0">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:12px"><h1 style="font-size:15px;font-weight:650;margin:0">驾驶</h1><span style="font-size:11px;color:#AAB4C3">按住移动 · 松手停车</span></div>
      <div style="width:256px;align-self:center;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(3,60px);gap:6px">
        <span></span>
        <button type="button" onPointerDown="{{forward}}" onPointerUp="{{release}}" onPointerCancel="{{release}}" style="border:1px solid #3B4350;background:#272E38;border-radius:17px;color:#EDF0F5;font-family:inherit;font-size:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;touch-action:none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 20V4m-6 6 6-6 6 6"></path></svg>前进</button>
        <span></span>
        <button type="button" onPointerDown="{{left}}" onPointerUp="{{release}}" onPointerCancel="{{release}}" style="border:1px solid #3B4350;background:#272E38;border-radius:17px;color:#EDF0F5;font-family:inherit;font-size:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;touch-action:none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M20 12H4m6-6-6 6 6 6"></path></svg>左转</button>
        <button type="button" onClick="{{stop}}" style="border:1px solid #584449;background:#35262B;border-radius:17px;color:#FFBEB7;font-family:inherit;font-size:13px;font-weight:650;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px"><svg width="15" height="15" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><rect x="3" y="3" width="14" height="14" rx="3"></rect></svg>停止</button>
        <button type="button" onPointerDown="{{right}}" onPointerUp="{{release}}" onPointerCancel="{{release}}" style="border:1px solid #3B4350;background:#272E38;border-radius:17px;color:#EDF0F5;font-family:inherit;font-size:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;touch-action:none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 12h16m-6-6 6 6-6 6"></path></svg>右转</button>
        <span></span>
        <button type="button" onPointerDown="{{backward}}" onPointerUp="{{release}}" onPointerCancel="{{release}}" style="border:1px solid #3B4350;background:#272E38;border-radius:17px;color:#EDF0F5;font-family:inherit;font-size:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;touch-action:none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 4v16m-6-6 6 6 6-6"></path></svg>后退</button>
        <span></span>
      </div>
      <p style="margin:0;text-align:center;font-size:11px;color:#B5BDCA;line-height:18px" aria-live="polite">{{motion}}</p>
    </section>
    <section style="display:flex;flex-direction:column;gap:8px;flex-shrink:0">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:12px"><h2 style="font-size:14px;font-weight:650;margin:0">炮台上下</h2><span style="font-size:11px;color:#AAB4C3">每次微调一点</span></div>
      <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px">
        <button type="button" onClick="{{up}}" style="height:44px;border:1px solid #3B4350;background:#222832;border-radius:13px;color:#EDF0F5;font-family:inherit;font-size:13px;display:flex;align-items:center;justify-content:center;gap:8px"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 20V4m-6 6 6-6 6 6"></path></svg>抬高一点</button>
        <button type="button" onClick="{{down}}" style="height:44px;border:1px solid #3B4350;background:#222832;border-radius:13px;color:#EDF0F5;font-family:inherit;font-size:13px;display:flex;align-items:center;justify-content:center;gap:8px"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 4v16m-6-6 6 6 6-6"></path></svg>压低一点</button>
      </div>
    </section>
    <div style="display:flex;align-items:center;gap:10px;height:52px;flex-shrink:0">
      <a href="Fire.dc.html" style="height:48px;flex:1;box-sizing:border-box;display:flex;align-items:center;justify-content:center;gap:8px;border:1px solid #49515D;border-radius:14px;color:#E0E4EA;font-size:13px;font-weight:600;text-decoration:none"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="3"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3"></path></svg>启用发射</a>
      <button type="button" disabled="{{true}}" style="height:48px;flex:1;border:1px solid #303743;border-radius:14px;background:#222832;color:#9DA8B8;font-family:inherit;font-size:14px;font-weight:650">单发 · 已锁定</button>
    </div>
  </main>
  <footer style="flex-shrink:0;padding:12px 20px 12px;display:flex;flex-direction:column;gap:8px">
    <button type="button" onClick="{{stop}}" style="height:52px;border:1px solid #82534F;border-radius:15px;background:#42282B;color:#FFD6D0;font-family:inherit;font-size:15px;font-weight:650;display:flex;align-items:center;justify-content:center;gap:9px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M8 3h8l5 5v8l-5 5H8l-5-5V8z"></path><path d="M9 9h6v6H9z"></path></svg>立即停止</button>
    <nav aria-label="主导航" style="height:64px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;border-top:1px solid #2A303A;padding-top:6px;box-sizing:border-box">
      <a href="Main.dc.html" aria-current="page" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:{{accent}};text-decoration:none;font-size:11px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="4"></rect><path d="M7 12h5M9.5 9.5v5M16 11h1M17 14h1"></path></svg>遥控</a>
      <a href="Voice.dc.html" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#AEB7C6;text-decoration:none;font-size:11px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M6 10v2a6 6 0 0 0 12 0v-2M12 18v3M9 21h6"></path></svg>语音</a>
      <a href="Connect.dc.html" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#AEB7C6;text-decoration:none;font-size:11px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="m9 15 6-6M8 17l-1 1a4 4 0 0 1-6-6l4-4a4 4 0 0 1 6 0M16 7l1-1a4 4 0 0 1 6 6l-4 4a4 4 0 0 1-6 0" transform="translate(0 -1)"></path></svg>连接</a>
    </nav>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#E8C547","options":["#E8C547","#94BDF7","#C7D890"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  state = {motion: '准备就绪'};
  renderVals() {
    const release = () => this.setState({motion: '已停止 · 发射已锁定'});
    const press = label => event => {
      event.preventDefault();
      event.currentTarget.setPointerCapture(event.pointerId);
      this.setState({motion: label});
    };
    return {
      accent: this.props.accent ?? '#E8C547', motion: this.state.motion,
      forward: press('前进中 · 松手即停'), backward: press('后退中 · 松手即停'),
      left: press('左转中 · 松手即停'), right: press('右转中 · 松手即停'), release, stop: release,
      up: () => this.setState({motion: '炮台抬高一点'}),
      down: () => this.setState({motion: '炮台压低一点'})
    };
  }
}
</script>
</body>
</html>
