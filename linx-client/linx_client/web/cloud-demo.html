<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>小车云端控制测试</title>
  <style>
    body { font: 16px system-ui, sans-serif; background: #f4f6f8; color: #18212b; margin: 0; }
    main { max-width: 500px; margin: auto; padding: 1.2rem; }
    section { background: white; border-radius: 12px; padding: 1rem; margin: 1rem 0; }
    h1 { font-size: 1.4rem; } p { line-height: 1.5; }
    input { box-sizing: border-box; width: 100%; padding: .8rem; font-size: 1rem; }
    button { border: 0; border-radius: 8px; padding: .8rem; font-size: 1rem; cursor: pointer; }
    #login button { margin-top: .5rem; background: #2065cb; color: white; }
    .pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: .5rem; }
    .pad button { min-height: 65px; touch-action: none; user-select: none; background: #dae9ff; }
    .pad button:disabled { opacity: .5; } .pad .stop { background: #df3030; color: white; }
    .barrel { display: grid; grid-template-columns: 1fr 1fr; gap: .5rem; }
    .barrel button { min-height: 64px; background: #dae9ff; touch-action: manipulation; }
    .weapons h2 { font-size: 1.1rem; margin: 0 0 .6rem; }
    .weapons button:disabled { opacity: .45; cursor: default; }
    .fire-controls { display: flex; gap: .5rem; }
    .fire-controls button { flex: 1; min-height: 64px; touch-action: manipulation; }
    #fire { background: #c92b36; color: white; font-weight: 650; }
    #action-status { min-height: 1.5em; color: #536273; }
    .voice h2 { font-size: 1.1rem; margin: 0 0 .6rem; }
    .voice button { width: 100%; min-height: 76px; background: #2065cb; color: white;
      font-size: 1.15rem; font-weight: 650; touch-action: manipulation; user-select: none;
      -webkit-user-select: none; -webkit-touch-callout: none; }
    .voice button[aria-pressed="true"] { background: #c92b36; }
    .voice button:disabled { background: #64748b; opacity: .7; cursor: default; }
    .voice-help { color: #536273; font-size: .9rem; }
    #voice-status { min-height: 1.5em; }
    #voice-status[data-error="true"] { color: #ad1724; }
    .voice-meter { display: flex; align-items: center; gap: .7rem; color: #536273; font-size: .85rem; margin-top: .8rem; }
    #mic-level { flex: 1; height: 12px; }
    #transcript:not(:empty) { background: #f0f4f9; border-radius: 8px; padding: .8rem; overflow-wrap: anywhere; }
  </style>
</head>
<body>
<main>
  <h1>小车云端控制测试</h1>
  <p id="mode">连接后显示小车状态。</p>
  <section>
    <form id="login">
      <label for="token">控制密码</label>
      <input id="token" type="password" autocomplete="off" required>
      <button type="submit">连接</button>
    </form>
    <p id="status" role="status">未连接</p>
  </section>
  <section class="voice">
    <h2>语音控车</h2>
    <p id="voice-status" role="status" aria-live="polite">请先输入密码连接</p>
    <button id="talk" type="button" aria-pressed="false" aria-describedby="voice-help" disabled>连接后可说话</button>
    <p id="voice-help" class="voice-help">点一下开始说话，再点一下结束，不用长按。首次使用请允许麦克风。</p>
    <div class="voice-meter"><span>麦克风音量</span><meter id="mic-level" min="0" max="1" value="0" aria-label="麦克风音量"></meter><span id="record-time">00:00</span></div>
    <p id="transcript"></p>
  </section>
  <section>
    <p>按住方向键移动，松手停车</p>
    <div class="pad">
      <span></span><button data-direction="forward" disabled>前进</button><span></span>
      <button data-direction="left" disabled>左转</button><button class="stop" id="stop" disabled>停车</button><button data-direction="right" disabled>右转</button>
      <span></span><button data-direction="backward" disabled>后退</button><span></span>
    </div>
  </section>
  <section class="weapons">
    <h2>炮台上下调节</h2>
    <p class="voice-help">每点一次微调一点，避免长时间顶住限位。</p>
    <div class="barrel">
      <button id="barrel-up" type="button" data-barrel="up" disabled>↑ 抬高一点</button>
      <button id="barrel-down" type="button" data-barrel="down" disabled>↓ 压低一点</button>
    </div>
    <h2 style="margin-top:1.4rem">单发控制</h2>
    <p id="fire-status" role="status">连接后显示发射状态</p>
    <div class="fire-controls">
      <button id="fire-arm" type="button" aria-pressed="false" disabled>启用发射</button>
      <button id="fire" type="button" disabled>发射一发</button>
    </div>
    <p class="voice-help">启用后可点单发，也可说“发射一发”。急停、断线或切到后台会重新锁定。</p>
    <p id="action-status" role="status" aria-live="polite"></p>
  </section>
</main>
<script>
  let ws, timer, activePointer, controlLease, realMode = false, carOnline = true;
  let audioContext, stream, worklet, audioFormat, playbackEnd = 0;
  let recording = false, preparingAudio = false, audioEpoch = 0;
  let linxSpeaking = false;
  let recordTimer, recordStarted = 0, frameCount = 0, heardSound = false;
  const playing = new Set();
  const status = document.querySelector('#status');
  const voiceStatus = document.querySelector('#voice-status');
  const micLevel = document.querySelector('#mic-level');
  const recordTime = document.querySelector('#record-time');
  const talkButton = document.querySelector('#talk');
  const buttons = document.querySelectorAll('.pad button');
  const barrelButtons = document.querySelectorAll('[data-barrel]');
  const fireArm = document.querySelector('#fire-arm');
  const fireButton = document.querySelector('#fire');
  const fireStatus = document.querySelector('#fire-status');
  const actionStatus = document.querySelector('#action-status');
  let fireState = {available: false, armed: false, reason: '连接后显示发射状态'};
  let fireUntil = 0, fireRefreshTimer;
  function updateFire() {
    const connected = ws?.readyState === WebSocket.OPEN && carOnline;
    fireArm.disabled = !connected || !fireState.available;
    fireArm.textContent = fireState.armed ? '锁定发射' : '启用发射';
    fireArm.setAttribute('aria-pressed', String(fireState.armed));
    fireButton.disabled = !connected || !fireState.armed || Date.now() < fireUntil;
    fireButton.textContent = Date.now() < fireUntil ? '冷却中…' : '发射一发';
    fireStatus.textContent = fireState.reason;
  }
  function send(message) {
    if (!ws || ws.readyState !== WebSocket.OPEN || ws.bufferedAmount >= 65536) return false;
    ws.send(JSON.stringify(message));
    return true;
  }
  function stop() {
    clearInterval(timer); timer = null; activePointer = null;
    send({type: 'stop'});
    if (fireState.armed) {
      fireState = {...fireState, armed: false, reason: '已停车，发射已锁定'};
      updateFire();
    }
  }
  function enable(on) {
    buttons.forEach(button => button.disabled = !on);
    barrelButtons.forEach(button => button.disabled = !on);
    updateFire();
  }
  function flushAudio() {
    playing.forEach(source => { try { source.stop(); } catch (_) {} });
    playing.clear(); playbackEnd = 0;
    updateTalkButton();
  }
  function voiceMessage(text, error = false) {
    voiceStatus.textContent = text;
    voiceStatus.dataset.error = String(error);
  }
  function updateTalkButton() {
    const available = !!(audioFormat && ws?.readyState === WebSocket.OPEN);
    const replying = linxSpeaking || !!(audioContext && playbackEnd && audioContext.currentTime < playbackEnd + .45);
    talkButton.disabled = !available || preparingAudio || replying;
    talkButton.setAttribute('aria-pressed', String(recording));
    talkButton.textContent = preparingAudio ? '正在打开麦克风…' : recording ? '结束说话' : replying ? '小车正在回复…' : available ? '点击开始说话' : '连接后可说话';
  }
  function stopTalking(message = '录音已结束，等待小车回复') {
    if (!recording) return;
    recording = false;
    clearInterval(recordTimer); recordTimer = null;
    if (worklet) worklet.port.postMessage({enabled: false});
    send({type: 'mic', on: false});
    micLevel.value = 0;
    updateTalkButton();
    voiceMessage(message);
  }
  function closeAudio(resetFormat = true) {
    audioEpoch++; preparingAudio = false;
    stopTalking(); flushAudio();
    linxSpeaking = false;
    if (stream) stream.getTracks().forEach(track => track.stop());
    if (audioContext) audioContext.close().catch(() => {});
    stream = audioContext = worklet = null;
    if (resetFormat) audioFormat = null;
    micLevel.value = 0;
    updateTalkButton();
  }
  function playAudio(data) {
    if (!audioContext || !audioFormat || data.byteLength % 2) return;
    if (playbackEnd > audioContext.currentTime + 10) return;
    const view = new DataView(data);
    const buffer = audioContext.createBuffer(1, data.byteLength / 2, audioFormat.sample_rate);
    const channel = buffer.getChannelData(0);
    for (let i = 0; i < channel.length; i++) channel[i] = view.getInt16(i * 2, true) / 32768;
    const source = audioContext.createBufferSource();
    source.buffer = buffer; source.connect(audioContext.destination);
    playbackEnd = Math.max(playbackEnd, audioContext.currentTime + .02);
    source.start(playbackEnd); playbackEnd += buffer.duration;
    playing.add(source);
    updateTalkButton();
    source.onended = () => { playing.delete(source); setTimeout(updateTalkButton, 450); };
  }
  function audioError(error) {
    if (error.name === 'NotAllowedError' || error.name === 'PermissionDeniedError') return '麦克风权限被拒绝。请在浏览器的网站权限中允许麦克风，再点击重试。';
    if (error.name === 'NotFoundError') return '没有找到麦克风，请检查手机或耳机的麦克风。';
    if (error.name === 'NotReadableError') return '麦克风被占用，请结束通话或关闭其他录音应用后重试。';
    return `录音未开始：${error.message}`;
  }
  async function openMicrophone(socket, epoch) {
    let pendingStream, pendingContext;
    try {
      if (!window.isSecureContext) throw new Error('请通过 HTTPS 地址打开网页');
      if (!navigator.mediaDevices?.getUserMedia) throw new Error('当前浏览器不支持录音，请用 Chrome 或 Safari 打开');
      const AudioClass = window.AudioContext || window.webkitAudioContext;
      if (!AudioClass) throw new Error('当前浏览器不支持音频，请换用 Chrome 或 Safari');
      // 在点击事件内创建并唤醒音频，避免手机浏览器阻止播放。
      pendingContext = new AudioClass();
      await pendingContext.resume();
      if (epoch !== audioEpoch || ws !== socket || document.hidden) return false;
      pendingStream = await navigator.mediaDevices.getUserMedia({audio: {channelCount: 1, echoCancellation: true, noiseSuppression: true}});
      if (epoch !== audioEpoch || ws !== socket || document.hidden) return false;
      if (!pendingContext.audioWorklet) throw new Error('当前浏览器不支持录音处理，请更新浏览器');
      await pendingContext.audioWorklet.addModule('/microphone-worklet.js');
      if (epoch !== audioEpoch || ws !== socket || socket.readyState !== WebSocket.OPEN || !audioFormat || document.hidden) return false;
      const source = pendingContext.createMediaStreamSource(pendingStream);
      const filter = pendingContext.createBiquadFilter(); filter.type = 'lowpass';
      filter.frequency.value = Math.min(7000, pendingContext.sampleRate * .45);
      const node = new AudioWorkletNode(pendingContext, 'microphone-pcm');
      const silent = pendingContext.createGain(); silent.gain.value = 0;
      source.connect(filter).connect(node).connect(silent).connect(pendingContext.destination);
      node.port.onmessage = event => {
        if (epoch !== audioEpoch || ws !== socket || socket.readyState !== WebSocket.OPEN) return;
        if (recording) {
          frameCount++;
          const view = new DataView(event.data);
          let peak = 0;
          for (let i = 0; i < view.byteLength; i += 2) peak = Math.max(peak, Math.abs(view.getInt16(i, true)) / 32768);
          heardSound ||= peak > .015;
          micLevel.value = Math.min(1, peak * 4);
          if (socket.bufferedAmount >= 65536) {
            stopTalking('网络拥堵，录音已停止，请稍后重试');
            return;
          }
        }
        if (socket.bufferedAmount < 65536) socket.send(event.data);
      };
      audioContext = pendingContext; stream = pendingStream; worklet = node;
      stream.getAudioTracks().forEach(track => track.addEventListener('ended', () => {
        if (epoch !== audioEpoch) return;
        closeAudio(false);
        voiceMessage('麦克风已断开，请检查权限后点击重试', true);
      }));
      pendingContext = pendingStream = null;
      return true;
    } finally {
      if (pendingStream) pendingStream.getTracks().forEach(track => track.stop());
      if (pendingContext) pendingContext.close().catch(() => {});
    }
  }
  talkButton.addEventListener('click', async () => {
    if (recording) { stopTalking(); return; }
    if (preparingAudio || !audioFormat || ws?.readyState !== WebSocket.OPEN) return;
    const socket = ws;
    const epoch = audioEpoch;
    let openingTimeout;
    preparingAudio = true; updateTalkButton();
    voiceMessage('正在打开麦克风；如果出现权限提示，请点允许');
    try {
      const open = async () => {
        if (!worklet && !await openMicrophone(socket, epoch)) return false;
        if (epoch !== audioEpoch) return false;
        await audioContext.resume();
        return true;
      };
      const opened = await Promise.race([open(), new Promise((_, reject) => {
        openingTimeout = setTimeout(() => reject(new Error('麦克风启动超时，请检查权限后点击重试')), 15000);
      })]);
      if (!opened) return;
      if (epoch !== audioEpoch || ws !== socket || socket.readyState !== WebSocket.OPEN || document.hidden) return;
      if (linxSpeaking || (playbackEnd && audioContext.currentTime < playbackEnd + .45)) {
        voiceMessage('请等小车回复播完，再点击说话');
        return;
      }
      if (!send({type: 'mic', on: true})) throw new Error('网络繁忙，请稍后重试');
      recording = true; frameCount = 0; heardSound = false;
      recordStarted = Date.now(); recordTime.textContent = '00:00';
      document.querySelector('#transcript').textContent = '';
      worklet.port.postMessage({enabled: true});
      voiceMessage('正在录音，请说话；说完点「结束说话」');
      recordTimer = setInterval(() => {
        const seconds = Math.floor((Date.now() - recordStarted) / 1000);
        recordTime.textContent = `00:${String(seconds).padStart(2, '0')}`;
        if (seconds >= 2 && !frameCount) {
          closeAudio(false);
          voiceMessage('未收到麦克风音频，请检查权限后点击重试', true);
        } else if (seconds >= 30) {
          stopTalking('已录音 30 秒，停止收音并等待回复');
        } else if (seconds >= 4 && !heardSound) {
          voiceMessage('正在录音，但声音很小；请靠近麦克风说话');
        }
      }, 250);
    } catch (error) {
      if (epoch !== audioEpoch) return;
      closeAudio(false);
      voiceMessage(audioError(error), true);
    } finally {
      clearTimeout(openingTimeout);
      if (epoch === audioEpoch) preparingAudio = false;
      updateTalkButton();
    }
  });
  document.querySelector('#login').addEventListener('submit', event => {
    event.preventDefault();
    if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) return;
    const input = document.querySelector('#token');
    const token = input.value; input.value = '';
    const scheme = location.protocol === 'https:' ? 'wss:' : 'ws:';
    ws = new WebSocket(`${scheme}//${location.host}/control`);
    ws.binaryType = 'arraybuffer';
    status.textContent = '正在连接';
    ws.onopen = () => send({type: 'auth', token});
    ws.onmessage = event => {
      if (event.data instanceof ArrayBuffer) { playAudio(event.data); return; }
      const message = JSON.parse(event.data);
      if (message.type === 'ready') {
        document.querySelector('#login').hidden = true;
        realMode = message.mode === '真实小车'; carOnline = message.car_online !== false;
        document.querySelector('#mode').textContent = realMode ? '实车模式：小车直连云端。' : '模拟模式：不会连接实车或发射。';
        fireState = message.fire || {available: false, armed: false, reason: '云端尚未启用发射'};
        status.textContent = realMode ? (carOnline ? '已连接：真实小车在线' : '已连接：等待小车上线') : '已连接：模拟小车';
        enable(carOnline);
      }
      if (message.type === 'lease') {
        controlLease = message.id;
        if (!document.hidden) send({type: 'presence', lease: controlLease});
      }
      if (message.type === 'car_status') {
        carOnline = message.online === true;
        if (!carOnline) fireState = {...fireState, armed: false, reason: '小车离线，发射已锁定'};
        status.textContent = carOnline ? '已连接：真实小车在线' : '小车已离线';
        enable(carOnline);
      }
      if (message.type === 'fire_state') { fireState = message; updateFire(); }
      if (message.type === 'action_result') {
        actionStatus.textContent = message.message;
        if (message.action === 'fire') {
          fireUntil = Date.now() + message.cooldown_ms;
          clearTimeout(fireRefreshTimer);
          fireRefreshTimer = setTimeout(updateFire, message.cooldown_ms);
          updateFire();
        }
      }
      if (message.type === 'audio_format') {
        audioFormat = message; updateTalkButton();
        if (!recording && !preparingAudio) voiceMessage('灵矽已连接，点击下面的按钮说话');
      }
      if (message.type === 'audio_flush') flushAudio();
      if (message.type === 'activation' && message.code) {
        voiceStatus.textContent = `请在灵矽智控台的设备管理中绑定，激活码：${message.code}`;
      }
      if (message.type === 'linx_event') {
        const item = message.event;
        if (item.type === 'conn' && item.state !== 'connected') { closeAudio(); voiceMessage('灵矽连接中断，恢复后可继续说话', true); }
        if (item.type === 'speaking') {
          linxSpeaking = item.on === true;
          if (linxSpeaking) { stopTalking(); voiceMessage('小车正在回复'); }
          else if (!recording && !preparingAudio && audioFormat) voiceMessage('录音已结束，可在回复播完后再次说话');
          updateTalkButton();
        }
        if (item.type === 'user' || item.type === 'bot') document.querySelector('#transcript').textContent = `${item.type === 'user' ? '你' : '小车'}：${item.text || ''}`;
      }
      if (message.type === 'error') { status.textContent = message.message; actionStatus.textContent = message.message; updateFire(); }
    };
    ws.onclose = event => { clearInterval(timer); timer = null; activePointer = controlLease = null; fireState = {available: false, armed: false, reason: '连接已断开，发射已锁定'}; enable(false); closeAudio(); document.querySelector('#login').hidden = false; voiceMessage('连接已断开，请重新输入密码连接', true); status.textContent = event.reason || '连接已断开'; };
    ws.onerror = () => { status.textContent = '连接失败，请检查网络后重试'; };
  });
  barrelButtons.forEach(button => button.addEventListener('click', () => {
    clearInterval(timer); timer = null; activePointer = null;
    send({type: 'barrel', direction: button.dataset.barrel, lease: controlLease});
  }));
  fireArm.addEventListener('click', () => {
    if (send({type: 'fire_arm', on: !fireState.armed, lease: controlLease})) fireArm.disabled = true;
  });
  fireButton.addEventListener('click', () => {
    if (!fireState.armed || Date.now() < fireUntil) return;
    clearInterval(timer); timer = null; activePointer = null;
    if (send({type: 'fire', lease: controlLease})) {
      fireUntil = Date.now() + 2000;
      clearTimeout(fireRefreshTimer);
      fireRefreshTimer = setTimeout(updateFire, 2000);
      updateFire();
    }
  });
  document.querySelectorAll('[data-direction]').forEach(button => {
    button.addEventListener('pointerdown', event => {
      if (activePointer != null) return;
      event.preventDefault(); activePointer = event.pointerId; button.setPointerCapture(event.pointerId);
      const move = () => send({type: 'drive', direction: button.dataset.direction, lease: controlLease});
      move(); timer = setInterval(move, 120);
    });
    ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(name => button.addEventListener(name, event => {
      if (event.pointerId === activePointer) stop();
    }));
  });
  document.querySelector('#stop').addEventListener('click', stop);
  window.addEventListener('blur', () => { stop(); stopTalking('录音已停止，请回到页面后再次点击说话'); });
  document.addEventListener('visibilitychange', () => { if (document.hidden) { stop(); closeAudio(false); voiceMessage('已暂停录音，回到页面后点击继续'); } });
</script>
</body>
</html>
