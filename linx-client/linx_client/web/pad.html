<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#111317">
<title>坦克手柄</title>
<style>
  /* 野战手柄：左摇杆（两侧履带功率条）/ 右炮管+开火；与控制台同一套橄榄底 + 信号琥珀 */
  :root {
    --bg: #12150F; --panel: #1B2017; --panel-2: #232A1E; --line: #333C2C; --text: #E8EADF; --muted: #A3AB96;
    --accent: #F0B23A; --accent-soft: #2A2416; --good: #7BD389; --bad: #E5484D; --bad-text: #FF8A8D; --bad-soft: #3A1D1E;
    --display: "Saira Stencil One", Impact, "Arial Black", sans-serif;
    --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
    color-scheme: dark;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); overflow: hidden; }
  body {
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", sans-serif;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
    display: grid; grid-template-rows: auto 1fr; height: 100dvh;
    padding: max(10px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
             max(10px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  }
  button { font: inherit; color: inherit; }
  header { display: flex; align-items: center; gap: 12px; min-height: 52px; }
  .brand { font-family: var(--display); font-size: 22px; line-height: 1; color: var(--accent); }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--bad); flex: none; }
  .dot.on { background: var(--good); box-shadow: 0 0 0 3px rgba(123,211,137,.2); }
  #status { flex: 1; min-width: 0; color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stop-wrap {
    flex: none; padding: 4px; border-radius: 7px;
    background: repeating-linear-gradient(-45deg, var(--accent) 0 8px, var(--bg) 8px 16px);
  }
  #stop {
    border: 0; border-radius: 4px; padding: 10px 22px; font-size: 17px;
    font-weight: 700; letter-spacing: .3em; padding-left: calc(22px + .3em); color: #fff; background: var(--bad);
  }
  main { display: grid; grid-template-columns: 1fr 1fr; align-items: center; gap: 16px; min-height: 0; }

  /* 摇杆 + 两侧履带功率条 */
  .drive { justify-self: center; display: flex; align-items: center; gap: 14px; }
  .track { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .track .bar { position: relative; width: 14px; height: min(34dvh, 130px); border-radius: 7px; background: var(--panel-2); overflow: hidden; }
  .track .bar::after { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: var(--line); }
  .track .bar i { position: absolute; left: 0; right: 0; height: 0; background: var(--good); }
  .track .bar i.rev { background: var(--accent); }
  .track span { font: 11px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; min-width: 4.5em; text-align: center; }
  #stick {
    position: relative; border-radius: 50%;
    width: min(36vw, 64dvh, 280px); aspect-ratio: 1;
    background: radial-gradient(circle, var(--panel-2) 0%, var(--panel) 70%); border: 2px solid var(--line);
  }
  #stick::before, #stick::after { content: ""; position: absolute; background: var(--line); }
  #stick::before { left: 50%; top: 10%; bottom: 10%; width: 1px; }
  #stick::after { top: 50%; left: 10%; right: 10%; height: 1px; }
  .ring { position: absolute; inset: 22%; border-radius: 50%; border: 1px dashed var(--line); }
  #knob {
    position: absolute; left: 50%; top: 50%; width: 36%; aspect-ratio: 1; border-radius: 50%;
    transform: translate(-50%, -50%); background: var(--accent);
    box-shadow: 0 0 0 8px rgba(240,178,58,.16), 0 6px 18px rgba(0,0,0,.5); z-index: 1;
  }
  #stick.active #knob { box-shadow: 0 0 0 12px rgba(240,178,58,.26), 0 6px 18px rgba(0,0,0,.5); }
  .label { position: absolute; color: var(--muted); font-size: 12px; }
  .l-up { top: 3%; left: 50%; transform: translateX(-50%); }
  .l-down { bottom: 3%; left: 50%; transform: translateX(-50%); }
  .l-left { left: 4%; top: 50%; transform: translateY(-50%); }
  .l-right { right: 4%; top: 50%; transform: translateY(-50%); }

  .buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; justify-self: center; width: min(42vw, 340px); }
  .btn {
    border: 2px solid var(--line); background: var(--panel); color: var(--text); border-radius: 6px;
    font-size: 16px; font-weight: 500; padding: 0; height: min(16dvh, 64px);
  }
  .btn.held { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 700; }
  #fire {
    grid-column: 1 / -1; height: min(28dvh, 112px); border-radius: 8px;
    border-color: var(--bad); color: var(--bad-text); background: var(--bad-soft);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
  }
  #fire b { font-size: 28px; letter-spacing: .4em; padding-left: .4em; }
  #fire small { font: 12px var(--mono); color: var(--muted); }
  #fire.held { background: var(--bad); color: #fff; }
  #fire.held small { color: #fff; }
  #fire.locked { opacity: .5; }
  #dance { grid-column: 1 / -1; height: min(11dvh, 44px); font-size: 14px; color: var(--muted); }
  #hint { display: none; }
  @media (orientation: portrait) {
    main { grid-template-columns: 1fr; grid-template-rows: auto auto; align-content: center; gap: 28px; }
    #stick { width: min(62vw, 280px); }
    .buttons { width: min(86vw, 380px); }
    #hint { display: block; grid-column: 1 / -1; text-align: center; color: var(--muted); font-size: 12px; }
  }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Stencil+One&family=JetBrains+Mono:wght@400&display=swap">
</head>
<body>
<header>
  <span class="brand">TK-01</span>
  <span class="dot" id="dot"></span>
  <span id="status">连接中…</span>
  <span class="stop-wrap"><button id="stop">急停</button></span>
</header>
<main>
  <div class="drive">
    <div class="track"><div class="bar"><i id="bar-l"></i></div><span id="val-l">L 0</span></div>
    <div id="stick">
      <div class="ring"></div>
      <span class="label l-up">前进</span><span class="label l-down">后退</span>
      <span class="label l-left">左</span><span class="label l-right">右</span>
      <div id="knob"></div>
    </div>
    <div class="track"><div class="bar"><i id="bar-r"></i></div><span id="val-r">R 0</span></div>
  </div>
  <div class="buttons">
    <button class="btn" data-barrel="1">炮管 ↑</button>
    <button class="btn" data-barrel="-1">炮管 ↓</button>
    <button class="btn" id="fire"><b>开火</b><small id="shots">已发 0 发</small></button>
    <button class="btn" id="dance">跳舞</button>
    <div id="hint">横过来更好操作</div>
  </div>
</main>
<script>
const $ = (id) => document.getElementById(id);
const key = new URLSearchParams(location.search).get("k") || "";
const DEAD = 0.12;      // 摇杆死区
const MIN_POWER = 55;   // 实测 40% 带不动履带：有效输入从 55% 起步
let ws, sx = 0, sy = 0, barrel = 0, wasActive = false;

function send(obj) { if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(obj)); }

function connect() {
  ws = new WebSocket(`ws://${location.host}/ws?k=${encodeURIComponent(key)}`);
  ws.onopen = () => $("dot").classList.add("on");
  ws.onclose = () => { $("dot").classList.remove("on"); $("status").textContent = "已断开，重连中…"; setTimeout(connect, 1000); };
  ws.onmessage = (ev) => {
    const e = JSON.parse(ev.data);
    const s = e.status;
    if (s) {
      $("status").textContent = (s.current || s.mission || "空闲") + (s.fire_enabled ? "" : " · 发射锁定");
      $("shots").textContent = s.fire_enabled ? `已发 ${s.shots_fired} 发` : "发射锁定";
      $("fire").classList.toggle("locked", !s.fire_enabled);
    }
    if (e.type === "error") $("status").textContent = "⚠ " + e.text;
  };
}

// 摇杆 → 两条履带：y 前后，x 原地转；每条履带的有效值映射到 MIN_POWER..100
function power(v) {
  if (Math.abs(v) < 0.08) return 0;
  return Math.sign(v) * Math.round(MIN_POWER + (100 - MIN_POWER) * Math.min(1, Math.abs(v)));
}
function tracks() {
  const mag = Math.hypot(sx, sy);
  if (mag < DEAD) return [0, 0];
  const l = Math.max(-1, Math.min(1, sy + sx)), r = Math.max(-1, Math.min(1, sy - sx));
  return [power(l), power(r)];
}

// 两侧功率条：中线往上是前进，往下是后退
function showTrack(side, v) {
  const bar = $("bar-" + side);
  bar.style.height = Math.abs(v) / 2 + "%";
  bar.style.top = v < 0 ? "50%" : "";
  bar.style.bottom = v < 0 ? "" : "50%";
  bar.classList.toggle("rev", v < 0);
  $("val-" + side).textContent = `${side.toUpperCase()} ${v > 0 ? "+" : ""}${v}`;
}

// 每 0.1 秒发一次当前状态（车上看门狗 0.4 秒），松手时补发一次全零让车立刻停
setInterval(() => {
  const [l, r] = tracks();
  showTrack("l", l);
  showTrack("r", r);
  const active = l !== 0 || r !== 0 || barrel !== 0;
  if (active || wasActive) send({ type: "pad", l, r, barrel });
  wasActive = active;
}, 100);

const stick = $("stick"), knob = $("knob");
let stickId = null;
function moveStick(ev) {
  const rect = stick.getBoundingClientRect();
  const R = rect.width / 2;
  let dx = ev.clientX - (rect.left + R), dy = ev.clientY - (rect.top + R);
  const d = Math.hypot(dx, dy), maxD = R * 0.7;
  if (d > maxD) { dx *= maxD / d; dy *= maxD / d; }
  sx = dx / maxD; sy = -dy / maxD;
  knob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
}
function releaseStick() {
  stickId = null; sx = sy = 0;
  knob.style.transform = "translate(-50%, -50%)";
  stick.classList.remove("active");
}
stick.addEventListener("pointerdown", (ev) => {
  stickId = ev.pointerId; stick.setPointerCapture(ev.pointerId); stick.classList.add("active"); moveStick(ev);
});
stick.addEventListener("pointermove", (ev) => { if (ev.pointerId === stickId) moveStick(ev); });
["pointerup", "pointercancel", "lostpointercapture"].forEach((t) =>
  stick.addEventListener(t, (ev) => { if (ev.pointerId === stickId) releaseStick(); }));

// 炮管：按住动，松手停
document.querySelectorAll("[data-barrel]").forEach((b) => {
  const v = Number(b.dataset.barrel);
  b.addEventListener("pointerdown", (ev) => { b.setPointerCapture(ev.pointerId); barrel = v; b.classList.add("held"); });
  ["pointerup", "pointercancel", "lostpointercapture"].forEach((t) =>
    b.addEventListener(t, () => { if (barrel === v) barrel = 0; b.classList.remove("held"); }));
});

function tap(el, fn) {
  el.addEventListener("pointerdown", () => { el.classList.add("held"); fn(); });
  ["pointerup", "pointercancel", "pointerleave"].forEach((t) => el.addEventListener(t, () => el.classList.remove("held")));
}
tap($("fire"), () => { send({ type: "action", name: "fire" }); navigator.vibrate?.(60); });
tap($("dance"), () => send({ type: "action", name: "dance" }));
tap($("stop"), () => { releaseStick(); barrel = 0; send({ type: "stop" }); navigator.vibrate?.([40, 40, 40]); });

// 切到后台时立刻停（锁屏、切 App）
document.addEventListener("visibilitychange", () => {
  if (document.hidden) { releaseStick(); barrel = 0; send({ type: "pad", l: 0, r: 0, barrel: 0 }); }
});
document.addEventListener("contextmenu", (ev) => ev.preventDefault());

connect();
</script>
</body>
</html>
